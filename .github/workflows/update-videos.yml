name: Update Watch page videos

# Once a day, pull the channel's 10 newest long-form videos and publish them.
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC, early morning in New Jersey
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the video list
        run: python3 tools/update_videos.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/videos.js img
          git diff --cached --quiet || git commit -m "Update Watch page videos"
          git push
